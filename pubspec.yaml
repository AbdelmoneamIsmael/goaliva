name: goaliva
description: "Goaliva — Your Goals. Your Momentum. A bilingual personal motivation and task companion."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # for state management
  flutter_bloc: ^9.1.1
  
  # for routing
  go_router: ^18.1.3
  # for localization
  easy_localization: ^3.0.8
  # for responsive design
  flutter_screenutil: ^5.9.3
  # for dependency injection
  get_it: ^9.3.0
  # for shared preferences
  shared_preferences: ^2.5.6
  # for calendar
  table_calendar: ^3.3.0
  calendar_view: ^2.0.0
  # for database
  sqflite: ^2.4.6
  # for freezed and handel state management
  freezed_annotation: ^3.1.0
  # for permissions
  permission_handler: ^13.0.2
  # for alarm
  alarm: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  build_runner: ^2.17.1


flutter:
  uses-material-design: true

  assets:
    - assets/translations/

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
